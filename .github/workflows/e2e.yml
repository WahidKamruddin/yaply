name: e2e

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # Node 22 to match netlify.toml's NODE_VERSION — test what actually ships,
      # even though local development runs a newer runtime.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Cheap and fast, and it catches a broken unit test before we spend four
      # minutes booting containers.
      - name: Unit tests
        run: npm run test

      - name: Typecheck
        run: |
          npx tsc --noEmit
          npx tsc -p e2e/tsconfig.json --noEmit

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Docker is preinstalled on ubuntu-latest.
      - name: Start Supabase
        run: supabase start

      # The migration regression test. This is the only place all migrations get
      # applied to a virgin database, and it is what would have caught the pg_cron
      # schema clause in 00042. Worth the workflow on its own.
      - name: Apply migrations to a virgin database
        run: supabase db reset

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
