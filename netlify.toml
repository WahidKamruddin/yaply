[build]
  base = "."
  command = "vite build && node scripts/generate-html.mjs"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # script-src/style-src need 'unsafe-inline' because TanStack Start injects
    # inline hydration scripts (with per-render dynamic data, so no stable hash)
    # and the app uses inline <style> blocks. A stricter nonce-based policy would
    # require the SSR function to emit a per-request nonce header — a separate change.
    # The main protection here is the tight connect-src, which blocks exfiltrating
    # the E2E private key / auth token to attacker-controlled origins.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://*.supabase.co https://*.giphy.com; media-src 'self' blob: https://*.supabase.co https://*.giphy.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.giphy.com; worker-src 'self' blob:; manifest-src 'self'"
